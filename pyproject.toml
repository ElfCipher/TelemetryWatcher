[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry"
version = "1.0.0"
description = "Lightweight system telemetry service for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Telemetry contributors"}]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=2",
    "build>=1.2",
    "ruff>=0.6",
]

[project.scripts]
telemetry = "telemetry.main:main"

[tool.setuptools.packages.find]
include = ["telemetry*"]

[tool.setuptools.package-data]
telemetry = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
    "frontend/vendor/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
